*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(circle at 50% 30%,#14585E,#0B3B40 70%);color:#F4F1EA;font-family:'Noto Serif KR',serif;display:flex;flex-direction:column;align-items:center;overflow:hidden}

<header><small>LINK MAGAZINE</small><h1>월간 링크 매거진 2호 · 2026.12</h1></header>
<div id="wrap"><div id="book"><div class="page"><img src="pages/p-1.jpg" alt="월간 링크 매거진 2호 1쪽"></div><div class="page"><img src="pages/p-2.jpg" alt="월간 링크 매거진 2호 2쪽"></div><div class="page"><img src="pages/p-3.jpg" alt="월간 링크 매거진 2호 3쪽"></div><div class="page"><img src="pages/p-4.jpg" alt="월간 링크 매거진 2호 4쪽" loading="lazy"></div><div class="page"><img src="pages/p-5.jpg" alt="월간 링크 매거진 2호 5쪽" loading="lazy"></div><div class="page"><img src="pages/p-6.jpg" alt="월간 링크 매거진 2호 6쪽" loading="lazy"></div><div class="page"><img src="pages/p-7.jpg" alt="월간 링크 매거진 2호 7쪽" loading="lazy"></div></div></div></div>
<nav><button id="pv" aria-label="이전">‹</button><span id="cnt">1 / 7</span><button id="nx" aria-label="다음">›</button></nav>
<div class="hint">모서리를 잡아 넘기거나 옆으로 밀어 보세요 · <a href="link-magazine-02.pdf" style="color:#F4F1EA">PDF</a> · <a href="https://heyzine.com/flip-book/b9ddb9090b.html" style="color:#F4F1EA">창간호</a> · <a href="/" style="color:#F4F1EA">홈페이지</a></div>
<script src="../page-flip.browser.js"></script>
<script>
const W=1165,H=1490;
function size(){const mh=innerHeight-150, mw=innerWidth-20;
 const two=mw>mh*1.1; let h=mh, w=h*W/H; const cols=two?2:1; if(w*cols>mw){w=mw/cols;h=w*H/W} return {w:Math.floor(w),h:Math.floor(h)}}
const s=size();
const pf=new St.PageFlip(document.getElementById('book'),{width:s.w,height:s.h,size:'fixed',showCover:true,usePortrait:true,maxShadowOpacity:.5,mobileScrollSupport:false,flippingTime:800});
pf.loadFromHTML(document.querySelectorAll('.page'));
const c=document.getElementById('cnt');pf.on('flip',e=>c.textContent=(e.data+1)+' / 7');
document.getElementById('pv').onclick=()=>pf.flipPrev();document.getElementById('nx').onclick=()=>pf.flipNext();
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')pf.flipNext();if(e.key==='ArrowLeft')pf.flipPrev()});
let t,lw=innerWidth;addEventListener('resize',()=>{if(Math.abs(innerWidth-lw)<40)return;clearTimeout(t);t=setTimeout(()=>location.reload(),400)});
</script></body></html>
